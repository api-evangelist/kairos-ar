envelope:
  description: >-
    Errors are returned as an Errors[] array of objects, each with a human
    Message and a numeric ErrCode. Most face-recognition errors are returned
    with an HTTP 200 status; authentication and rate-limit errors use real HTTP
    status codes. Emotion Analysis (v2) endpoints instead return a flat
    { code, message } or { status_code, status_message } object.
  fields:
    - Errors
    - Message
    - ErrCode
