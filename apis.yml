name: Kairos AR
description: >-
  Kairos AR, Inc. is a Miami-based human-analytics company providing face
  recognition, facial detection, and emotion analysis as a REST API. The
  platform lets developers enroll, verify, and recognize faces against galleries
  they create, detect faces and facial features (age, gender, ethnicity,
  glasses, landmarks) in photos, and analyze emotion, demographics and attention
  across images and video. Requests and responses are JSON and every call is
  authenticated with an app_id + app_key header pair. Kairos ships official SDKs
  for JavaScript, PHP, Android, and .NET, publishes an Apiary-hosted API
  reference with a live sandbox console, and offers a free tier plus usage-based
  pricing and an on-premise biometric offering. The company was surfaced as a
  500 Global portfolio company and is enriched here into the API Evangelist
  network.
